<style>
:root{--bd:rgba(150,160,255,.14)}
html{scroll-behavior:smooth;background:#070815}
html,body{margin:0!important;padding:0!important;overflow-x:hidden}
body{min-height:100vh;font-family:Geist,system-ui,sans-serif;font-variant-numeric:tabular-nums;background:radial-gradient(900px 600px at 10% -5%,rgba(79,140,255,.2),transparent 60%),radial-gradient(800px 600px at 95% 8%,rgba(139,92,246,.2),transparent 60%),linear-gradient(#070815,#0a0c1c);background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(150,160,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(150,160,255,.045) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000,transparent 75%);mask-image:radial-gradient(ellipse at 50% 30%,#000,transparent 75%)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:#070815}::-webkit-scrollbar-thumb{background:#2f3560;border-radius:4px}

.b{transition:height .2s cubic-bezier(.4,0,.2,1)}
h1,h2,h3{font-family:'Bricolage Grotesque',Geist,sans-serif;letter-spacing:-.025em;font-weight:700}
:focus-visible{outline:2px solid #8f9bff;outline-offset:2px}
#scene{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:none}
.grid-scan{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;display:none;pointer-events:none;overflow:hidden;background:#08060f}
.grid-scan-canvas{position:absolute;inset:0;display:block;width:100%;height:100%;pointer-events:none}
#bg-gridscan{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;display:none;pointer-events:none;overflow:hidden;background:#08060f}
body:not([data-r=home]):before{display:none}
#app{position:relative;z-index:1;padding-top:76px;min-height:100vh;display:flex;flex-direction:column}
body[data-r=home] #app{padding-top:0}
#app.vin>*{animation:vin .4s cubic-bezier(.2,.7,.2,1) both}
@keyframes vin{from{opacity:0;transform:translateY(10px)}}
#app>div[class*=max-w]{max-width:1280px!important;padding:20px 24px 56px!important;flex:1 0 auto}

/* Fixed Global Navbar (Almost-black, deep dark purple with subtle glass effects) */
#fn{position:fixed;top:0;left:0;right:0;width:100%;height:64px;z-index:100;background:rgba(9,7,20,.88);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid rgba(140,120,240,.12);box-shadow:0 4px 24px -2px rgba(0,0,0,.6);display:flex;align-items:center}
.nav-wrap{max-width:1320px;width:100%;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;color:#fff;font:700 20px 'Bricolage Grotesque',Geist,sans-serif;letter-spacing:-.02em;padding:0}
#nav{display:flex;align-items:center;gap:6px}
.nl{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:9px;border:0;cursor:pointer;white-space:nowrap;font-size:13.5px;font-weight:500;color:#9ba3cb;background:transparent;transition:all .2s cubic-bezier(.2,.8,.2,1)}

@media(max-width:960px){.nav-cta{display:none}.nl span:last-child{display:none}.nl.on span:last-child{display:inline}.nl{padding:8px 11px}}

/* Section Sub-Navigation */

.sn{display:flex;align-items:center;padding:7px 16px;border-radius:8px;border:0;cursor:pointer;white-space:nowrap;font-size:13px;font-weight:500;color:#9ba3cb;background:transparent;transition:color .2s,background .2s,box-shadow .2s}

/* Professional Deep Dark-Purple Footer on Every Page */

/* Production Landing */
.hero{position:relative;min-height:100vh;display:flex;align-items:center;padding:120px 24px 90px}

.hero-in{position:relative;max-width:1180px;width:100%;margin:0 auto}
.hero h1{font-size:clamp(2.8rem,7.5vw,5.8rem);line-height:1.02;font-weight:700;letter-spacing:-.04em;max-width:14ch;color:#f4f5ff;text-wrap:balance}

.cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:13px 24px;border-radius:10px;border:1px solid transparent;cursor:pointer;font:600 14px Geist,-apple-system,sans-serif;color:#fff;letter-spacing:-.01em;transition:all .2s cubic-bezier(.2,.8,.2,1)}
.cta .ms{font-size:18px}
.cta-pri{background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%);border-color:rgba(165,145,255,.35);box-shadow:0 4px 14px -2px rgba(99,102,241,.45),inset 0 1px 0 rgba(255,255,255,.22)}
.cta-pri:hover{transform:translateY(-1px);background:linear-gradient(135deg,#6d70ff 0%,#9869ff 100%);box-shadow:0 8px 22px -2px rgba(99,102,241,.65),inset 0 1px 0 rgba(255,255,255,.32)}
.cta-gl{background:rgba(255,255,255,.05);border-color:rgba(140,120,240,.22);color:#e2e8f0;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.cta-gl:hover{transform:translateY(-1px);background:rgba(255,255,255,.09);border-color:rgba(160,140,255,.45);color:#fff;box-shadow:0 6px 18px -4px rgba(0,0,0,.4)}
.cue{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:rgba(255,255,255,.05);color:#a9afd0;cursor:pointer}
.cue:hover{color:#fff;background:rgba(255,255,255,.1)}
.ws{padding:30px 24px 70px}
.ws-in{max-width:1180px;margin:0 auto;display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.wc{display:flex;flex-direction:column;gap:18px;padding:32px;border-radius:28px;border:1px solid var(--bd);background:linear-gradient(160deg,rgba(26,30,70,.6),rgba(10,12,30,.72));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:border-color .3s,transform .3s}
.wc:hover{border-color:rgba(150,140,255,.45);transform:translateY(-3px)}
.wc h2{font-size:2.1rem;font-weight:700;letter-spacing:-.03em;color:#f4f5ff}
.wc ul{list-style:none;margin:0;padding:0;display:grid;gap:11px;color:#c3c8e6;font-size:14px}
.wc li{display:flex;align-items:center;gap:10px}.wc li .ms{color:#8f9bff}
.viz{height:130px;display:flex;align-items:flex-end;gap:6px;padding:14px;border-radius:18px;background:rgba(5,6,18,.55);border:1px solid var(--bd)}
.viz i{flex:1;border-radius:6px 6px 2px 2px;background:linear-gradient(#8f7bff,#4f8cff);opacity:.85}
.pxg{height:130px;display:grid;grid-template-columns:repeat(16,1fr);grid-template-rows:repeat(5,1fr);gap:3px;padding:14px;border-radius:18px;background:rgba(5,6,18,.55);border:1px solid var(--bd)}
.pxg i{border-radius:3px;background:#8f9bff}
.ft{padding:36px 24px 52px;text-align:center;color:#7a82ad;font-size:13px;border-top:1px solid var(--bd)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

<script>
const $ = s => document.querySelector(s), rnd = n => Math.floor(Math.random() * n);

const NAV = [
  ['home', 'Overview', 'dashboard', 'home'],
  ['visualize', 'Algorithm Studio', 'terminal', 'algo'],
  ['vision', 'Vision Studio', 'auto_awesome', 'vision'],
  ['compare', 'Benchmark Arena', 'splitscreen', 'compare'],
  ['about', 'Architecture & Docs', 'menu_book', 'about']
];

const META = {
  quick: { n:'Quick Sort', cat:'Sorting', f:'Divide & Conquer', tg:['In-Place','Unstable'], d:'Partition-exchange sort: picks a pivot, partitions around it (Hoare dual-pointer or Lomuto single-pointer), then recurses on both slices.', avg:'O(n log n)', w:'O(n²)', sp:'O(log n)' },
  merge: { n:'Merge Sort', cat:'Sorting', f:'Divide & Conquer', tg:['Stable','Out-of-Place'], d:'Recursively halves the array, then merges sorted halves through an auxiliary buffer.', avg:'O(n log n)', w:'O(n log n)', sp:'O(n)' },
  heap: { n:'Heap Sort', cat:'Sorting', f:'Selection', tg:['In-Place','Unstable'], d:'Builds a max-heap, then repeatedly moves the maximum element to the end and sifts down.', avg:'O(n log n)', w:'O(n log n)', sp:'O(1)' },
  bubble: { n:'Bubble Sort', cat:'Sorting', f:'Exchange', tg:['In-Place','Stable'], d:'Repeatedly swaps adjacent out-of-order elements until the array is fully sorted.', avg:'O(n²)', w:'O(n²)', sp:'O(1)' },
  insertion: { n:'Insertion Sort', cat:'Sorting', f:'Insertion', tg:['In-Place','Stable'], d:'Grows a sorted prefix by inserting each element into its correct position.', avg:'O(n²)', w:'O(n²)', sp:'O(1)' },
  selection: { n:'Selection Sort', cat:'Sorting', f:'Selection', tg:['In-Place','Unstable'], d:'Repeatedly selects the minimum of the unsorted part and swaps it to the front.', avg:'O(n²)', w:'O(n²)', sp:'O(1)' },
  binary: { n:'Binary Search', cat:'Searching', f:'Divide & Conquer', t:'search', tg:['Searching','Sorted input'], d:'Logarithmic interval halving with lo/mid/hi pointers over a sorted array.', avg:'O(log n)', w:'O(log n)', sp:'O(1)', lg:[['Mid','text-pri'],['Found','text-ter'],['Out of range','text-ol']] },
  linear: { n:'Linear Search', cat:'Searching', f:'Sequential', t:'search', tg:['Searching','Simple'], d:'Sequentially inspects every item in the list until target match is found.', avg:'O(n)', w:'O(n)', sp:'O(1)' },

  minmax_lin: { n:'Min-Max (Linear)', cat:'Algorithmic Primitives', f:'Linear Scan', tg:['Linear','3n/2 Comparisons'], d:'Finds minimum and maximum elements in an array using a single linear scan in 3n/2 comparisons.', avg:'O(n)', w:'O(n)', sp:'O(1)', lg:[['Min','text-pri'],['Max','text-ter'],['Current','text-err']] },
  minmax_dc: { n:'Min-Max (Divide & Conquer)', cat:'Algorithmic Primitives', f:'Divide & Conquer', tg:['Divide & Conquer','Recursive'], d:'Recursively divides array into halves and combines local min/max results.', avg:'O(n)', w:'O(n)', sp:'O(log n)', lg:[['Range','text-pri'],['Min','text-ter'],['Max','text-ok']] },
  dyn_insert: { n:'Dynamic Array Insertion', cat:'Algorithmic Primitives', f:'Dynamic Array', tg:['Array Shift','Capacity'], d:'Shifts elements right step-by-step to insert a new element at a target index.', avg:'O(n)', w:'O(n)', sp:'O(1)', lg:[['Target','text-ter'],['Shifted','text-pri'],['Inserted','text-ok']] },
  kbit_cnt: { n:'K-bit Counter', cat:'Algorithmic Primitives', f:'Amortized Analysis', tg:['Binary Counter','Amortized O(1)'], d:'Simulates a K-bit binary counter demonstrating aggregate and amortized O(1) cost per increment.', avg:'O(1) amortized', w:'O(k)', sp:'O(k)', lg:[['Bit 1','text-pri'],['Flipped 0','text-ter'],['Carry','text-err']] },
  closest_pair: { n:'Closest Pair of Points', cat:'Algorithmic Primitives', f:'Divide & Conquer', tg:['2D Geometry','Divide & Conquer'], d:'Finds closest pair among 2D points using brute-force O(n²) or divide-and-conquer O(n log n).', avg:'O(n log n)', w:'O(n²)', sp:'O(n)', lg:[['Current Pair','text-ter'],['Best Pair','text-ok'],['Min Dist','text-pri']] },
  mat_mult: { n:'Matrix Multiplication', cat:'Algorithmic Primitives', f:'Iterative / D&C', t:'dp', tg:['Linear Algebra','Triply Nested Loop'], d:'Computes matrix product C[i][j] = sum(A[i][k]*B[k][j]) with step-by-step partial sums.', avg:'O(n³)', w:'O(n³)', sp:'O(n²)', lg:[['Cell i,j','text-ter'],['A[i][k]','text-pri'],['B[k][j]','text-sec']] },
  fibonacci: { n:'Fibonacci', cat:'Algorithmic Primitives', f:'Recursion / DP', tg:['Recursive','Iterative / DP'], d:'Computes nth Fibonacci number highlighting call trees, memoization, and iterative loops.', avg:'O(n)', w:'O(2ⁿ)', sp:'O(n)', lg:[['F(i-2)','text-sec'],['F(i-1)','text-pri'],['F(i)','text-ok']] },
  sum_digits: { n:'Sum of Digits', cat:'Algorithmic Primitives', f:'Arithmetic', tg:['Digit Extraction','Modulo 10'], d:'Extracts digits using modulo 10 and accumulates a running total.', avg:'O(log₁₀ n)', w:'O(log₁₀ n)', sp:'O(1)', lg:[['Current digit','text-ter'],['Running sum','text-ok']] },

  dijkstra: { n:"Dijkstra's Shortest Path", cat:'Graph Theory', f:'Greedy', t:'graph', tg:['Graph Theory','Optimal'], d:'Single-source shortest paths on non-negative weighted graphs via greedy edge relaxation.', avg:'O(V²)', w:'O(V²)', sp:'O(V)', lg:[['Current','text-ter'],['Visited','text-pri'],['Relaxed edge','text-err'],['Shortest path','text-ok']] },
  astar: { n:'A* Pathfinding', cat:'Heuristic Search', f:'Heuristic Search', t:'grid', tg:['Spatial Grid','Informed'], d:'Informed search expanding lowest f(n)=g(n)+h(n) grid cell using Manhattan distance heuristic.', avg:'O(b^d)', w:'O(b^d)', sp:'O(b^d)', lg:[['Current','text-ter'],['Open set','text-pri'],['Closed set','text-sec'],['Path','text-ok']] },
  dfs: { n:'Depth-First Search (DFS)', cat:'AI Search', f:'Uninformed Search', t:'grid', tg:['Stack','Graph/Grid Search'], d:'Plunges deep along branches using an explicit Stack before backtracking.', avg:'O(V+E)', w:'O(V+E)', sp:'O(V)', lg:[['Current','text-ter'],['Stack','text-pri'],['Visited','text-sec'],['Path','text-ok']] },
  bfs: { n:'Breadth-First Search (BFS)', cat:'AI Search', f:'Uninformed Search', t:'grid', tg:['Queue','Shortest Path'], d:'Explores level-by-level using an explicit Queue to guarantee shortest path on unweighted graphs.', avg:'O(V+E)', w:'O(V+E)', sp:'O(V)', lg:[['Current','text-ter'],['Queue','text-pri'],['Visited','text-sec'],['Path','text-ok']] },
  greedy: { n:'Greedy Best-First Search', cat:'AI Search', f:'Heuristic Search', t:'grid', tg:['Priority Queue','h(n) Only'], d:'Expands node appearing closest to goal using heuristic h(n) (does not consider cost spent g(n)).', avg:'O(bᵐ)', w:'O(bᵐ)', sp:'O(bᵐ)', lg:[['Current','text-ter'],['Frontier h(n)','text-pri'],['Visited','text-sec'],['Path','text-ok']] },
  w_astar: { n:'Weighted A*', cat:'AI Search', f:'Weighted Heuristic', t:'grid', tg:['Priority Queue','f(n)=g+w*h'], d:'Uses weighted heuristic f(n)=g(n)+w*h(n) to balance search speed vs path optimality.', avg:'O(bᵈ)', w:'O(bᵈ)', sp:'O(bᵈ)', lg:[['Current','text-ter'],['Open set (w*h)','text-pri'],['Closed set','text-sec'],['Path','text-ok']] },
  ai_compare: { n:'AI Search Comparison', cat:'AI Search', f:'Benchmark Arena', t:'grid', tg:['DFS vs BFS vs A*','Metrics Comparison'], d:'Evaluates DFS, BFS, Greedy, A*, and Weighted A* on the identical grid map.', avg:'O(V+E)', w:'O(V+E)', sp:'O(V)', lg:[['DFS','text-pri'],['BFS','text-sec'],['A*','text-ok']] },
  knap: { n:'0/1 Knapsack', cat:'Dynamic Programming', f:'Dynamic Prog.', t:'dp', tg:['Combinatorial','Optimization'], d:'Optimal value under a capacity limit by tabulating overlapping subproblems and backtracking.', avg:'O(n·W)', w:'O(n·W)', sp:'O(n·W)', lg:[['Current cell','text-ter'],['Dependencies','text-pri'],['Chosen path','text-ok']] }
};

const TY = k => META[k].t || 'sort';

const CODE = {
  quick: [
    'def quicksort(a, lo, hi):',
    '    pivot = a[lo]',
    '    i = lo - 1; j = hi + 1',
    '    while True:',
    '        i += 1  # scan right while a[i] < pivot',
    '        while a[i] < pivot: i += 1',
    '        j -= 1  # scan left while a[j] > pivot',
    '        while a[j] > pivot: j -= 1',
    '        if i >= j: return j',
    '        a[i], a[j] = a[j], a[i]  # SWAP',
    '    quicksort(a, lo, j)',
    '    quicksort(a, j+1, hi)'
  ],
  merge: [
    'def merge_sort(a, lo, hi):',
    '    if lo >= hi: return',
    '    mid = (lo + hi) // 2',
    '    merge_sort(a, lo, mid)',
    '    merge_sort(a, mid+1, hi)',
    '    L = a[lo:mid+1]; R = a[mid+1:hi+1]',
    '    while L and R:',
    '        a[k] = L.pop(0) if L[0] <= R[0] else R.pop(0)',
    '    a[k:] = L + R  # copy leftovers'
  ],
  heap: [
    'def heap_sort(a):',
    '    # Build max-heap',
    '    for i in range(len(a)//2 - 1, -1, -1):',
    '        sift_down(a, i, len(a))',
    '    # Extract max elements',
    '    for end in range(len(a)-1, 0, -1):',
    '        a[0], a[end] = a[end], a[0]  # SWAP',
    '        sift_down(a, 0, end)'
  ],
  bubble: [
    'def bubble_sort(a):',
    '    n = len(a)',
    '    for i in range(n - 1):',
    '        for j in range(n - 1 - i):',
    '            if a[j] > a[j+1]:',
    '                a[j], a[j+1] = a[j+1], a[j]  # SWAP'
  ],
  insertion: [
    'def insertion_sort(a):',
    '    for i in range(1, len(a)):',
    '        j = i - 1',
    '        while j >= 0 and a[j] > a[j+1]:',
    '            a[j], a[j+1] = a[j+1], a[j]  # SHIFT',
    '            j -= 1'
  ],
  selection: [
    'def selection_sort(a):',
    '    for i in range(len(a) - 1):',
    '        m = i  # scan for minimum',
    '        for j in range(i + 1, len(a)):',
    '            if a[j] < a[m]: m = j',
    '        if m != i: a[i], a[m] = a[m], a[i]  # SWAP'
  ],
  binary: [
    'def binary_search(a, target):',
    '    lo, hi = 0, len(a) - 1',
    '    while lo <= hi:',
    '        mid = (lo + hi) // 2',
    '        if a[mid] == target: return mid',
    '        elif a[mid] < target: lo = mid + 1',
    '        else: hi = mid - 1',
    '    return -1'
  ],
  linear: [
    'def linear_search(a, target):',
    '    for i in range(len(a)):',
    '        if a[i] == target:',
    '            return i',
    '    return -1'
  ],
  minmax_lin: [
    'def min_max_linear(arr):',
    '    min_val = arr[0]; max_val = arr[0]',
    '    for i in range(1, len(arr)):',
    '        if arr[i] < min_val: min_val = arr[i]',
    '        elif arr[i] > max_val: max_val = arr[i]',
    '    return min_val, max_val'
  ],
  minmax_dc: [
    'def min_max_dc(arr, low, high):',
    '    if low == high: return (arr[low], arr[low])',
    '    mid = (low + high) // 2',
    '    min1, max1 = min_max_dc(arr, low, mid)',
    '    min2, max2 = min_max_dc(arr, mid + 1, high)',
    '    return min(min1, min2), max(max1, max2)'
  ],
  dyn_insert: [
    'def dynamic_array_insert(arr, index, value):',
    '    n = len(arr); arr.append(0)  # expand',
    '    for j in range(n - 1, index - 1, -1):',
    '        arr[j + 1] = arr[j]  # shift right',
    '    arr[index] = value  # insert',
    '    return arr'
  ],
  kbit_cnt: [
    'def k_bit_counter(k, increments):',
    '    bits = [0] * k',
    '    for step in range(increments):',
    '        i = 0',
    '        while i < k and bits[i] == 1:',
    '            bits[i] = 0; i += 1  # flip 1->0',
    '        if i < k: bits[i] = 1  # flip 0->1'
  ],
  closest_pair: [
    'def closest_pair(points):',
    '    # Sort by X, divide into left & right halves',
    '    d = min(dl, dr)',
    '    strip = [p for p in P_y if abs(p.x - mid.x) < d]',
    '    return strip_closest(strip, d)'
  ],
  mat_mult: [
    'def matrix_mult(A, B):',
    '    for i in range(n):',
    '        for j in range(n):',
    '            for k in range(n):',
    '                C[i][j] += A[i][k] * B[k][j]'
  ],
  fibonacci: [
    'def fibonacci(n):',
    '    a, b = 0, 1',
    '    for i in range(2, n + 1):',
    '        a, b = b, a + b',
    '    return b'
  ],
  sum_digits: [
    'def sum_of_digits(num):',
    '    total = 0',
    '    while num > 0:',
    '        total += num % 10',
    '        num //= 10',
    '    return total'
  ],
  dijkstra: [
    'def dijkstra(G, src):',
    '    dist = {v: inf for v in G}; dist[src] = 0',
    '    while unvisited:',
    '        u = min(unvisited, key=lambda v: dist[v])',
    '        mark u visited',
    '        for v, w in G[u]:',
    '            if dist[u] + w < dist[v]:  # RELAX',
    '                dist[v] = dist[u] + w; prev[v] = u'
  ],
  astar: [
    'def a_star(grid, start, goal):',
    '    open_set = {start}; g[start] = 0',
    '    while open_set:',
    '        cur = min(open_set, key=lambda c: g[c] + h(c))',
    '        if cur == goal: return reconstruct_path(cur)',
    '        closed_set.add(cur)',
    '        for nb in neighbors(cur):',
    '            if g[cur] + 1 < g[nb]:',
    '                g[nb] = g[cur] + 1; open_set.add(nb)'
  ],
  dfs: [
    'def dfs(grid, start, goal):',
    '    stack = [start]; visited = set()',
    '    while stack:',
    '        node = stack.pop()',
    '        if node == goal: return reconstruct_path(node)',
    '        for nb in neighbors(node):',
    '            if nb not in visited:',
    '                visited.add(nb); stack.append(nb)'
  ],
  bfs: [
    'def bfs(grid, start, goal):',
    '    queue = [start]; visited = {start}',
    '    while queue:',
    '        node = queue.pop(0)',
    '        if node == goal: return reconstruct_path(node)',
    '        for nb in neighbors(node):',
    '            if nb not in visited:',
    '                visited.add(nb); queue.append(nb)'
  ],
  greedy: [
    'def greedy_best_first(grid, start, goal):',
    '    # Greedy Best-First chooses lowest h(n)',
    '    open_pq = [(h(start), start)]',
    '    while open_pq:',
    '        h_val, node = heappop(open_pq)',
    '        if node == goal: return path',
    '        for nb in neighbors(node):',
    '            heappush(open_pq, (h(nb), nb))'
  ],
  w_astar: [
    'def weighted_a_star(grid, start, goal, w=1.5):',
    '    # f(n) = g(n) + w * h(n)',
    '    open_pq = [(w * h(start), 0, start)]',
    '    while open_pq:',
    '        f, g, node = heappop(open_pq)',
    '        if node == goal: return path',
    '        for nb in neighbors(node):',
    '            heappush(open_pq, (g+1 + w*h(nb), g+1, nb))'
  ],
  ai_compare: [
    '# AI Search Comparison Arena',
    'for algo in [DFS, BFS, Greedy, A*, WeightedA*]:',
    '    results[algo] = run_search(grid, start, goal)'
  ],
  knap: [
    'def knapsack(weights, values, W):',
    '    dp = [[0]*(W+1) for _ in range(n+1)]',
    '    for i in range(1, n+1):',
    '        for w in range(W+1):',
    '            dp[i][w] = dp[i-1][w]  # skip item',
    '            if weights[i-1] <= w:  # take item',
    '                dp[i][w] = max(dp[i][w], dp[i-1][w-weights[i-1]] + values[i-1])',
    '    return dp[n][W]  # backtrack optimal items'
  ]
};

// ---- Graph & Grid constants ----
const GN = [['S',40,150],['A',160,45],['B',160,255],['C',300,45],['D',300,255],['E',440,100],['T',520,200]];
const GE = [[0,1],[0,2],[1,2],[1,3],[2,4],[3,4],[3,5],[4,5],[4,6],[5,6]];
const GW = 14, GH = 8;

// ---- engine: records atomic execution snapshots ----
let S = [], C = 0, W = 0, ST = 'hoare', TGT = 44;
let TR = [], STK = [];
const enter = (lo, hi) => { STK.push(TR.push({ p: STK.at(-1) ?? -1, lo, hi, d: STK.length }) - 1); };
const leave = () => STK.pop();
const R = (a, o = {}) => S.push({ a: a.slice(), c: C, w: W, stk: STK.slice(), tn: TR.length, ...o });
const sw = (a, i, j) => { [a[i], a[j]] = [a[j], a[i]]; W++; };

const ALG = {
  quick(a, lo = 0, hi = a.length - 1) {
    if (lo >= hi) return;
    enter(lo, hi);
    let p, i, j;
    if (ST == 'hoare') {
      p = a[lo]; i = lo - 1; j = hi + 1;
      R(a, { piv: lo, rng: [lo, hi], l: 1, m: `Pivot ${p} chosen at index ${lo} for range [${lo}..${hi}].` });
      for (;;) {
        do { i++; C++; R(a, { piv: lo, rng: [lo, hi], cmp: [i], pi: i, pj: j, l: 3, m: `Left pointer i=${i}: a[i]=${a[i]} ${a[i] < p ? '<' : '≥'} pivot ${p}.` }); } while (a[i] < p);
        do { j--; C++; R(a, { piv: lo, rng: [lo, hi], cmp: [j], pi: i, pj: j, l: 4, m: `Right pointer j=${j}: a[j]=${a[j]} ${a[j] > p ? '>' : '≤'} pivot ${p}.` }); } while (a[j] > p);
        if (i >= j) {
          R(a, { rng: [lo, hi], pi: i, pj: j, l: 5, m: `Pointers crossed (i=${i} ≥ j=${j}); partition complete. Recurse on [${lo}..${j}] and [${j+1}..${hi}].` });
          break;
        }
        sw(a, i, j);
        R(a, { piv: lo, rng: [lo, hi], swp: [i, j], pi: i, pj: j, l: 6, m: `a[${i}]=${a[i]} and a[${j}]=${a[j]} swapped to restore Hoare invariant.` });
      }
      ALG.quick(a, lo, j);
      ALG.quick(a, j + 1, hi);
    } else {
      p = a[hi]; i = lo - 1;
      R(a, { piv: hi, rng: [lo, hi], l: 1, m: `Lomuto partition: pivot ${p} selected at index ${hi}.` });
      for (j = lo; j < hi; j++) {
        C++;
        R(a, { piv: hi, rng: [lo, hi], cmp: [j], pi: i, pj: j, l: 3, m: `Compare a[${j}]=${a[j]} with pivot ${p}.` });
        if (a[j] < p) {
          i++; sw(a, i, j);
          R(a, { piv: hi, rng: [lo, hi], swp: [i, j], pi: i, pj: j, l: 6, m: `a[${j}] < pivot: swap into left partition index ${i}.` });
        }
      }
      sw(a, i + 1, hi);
      R(a, { rng: [lo, hi], swp: [i + 1, hi], l: 6, m: `Pivot placed at final sorted index ${i + 1}.` });
      ALG.quick(a, lo, i);
      ALG.quick(a, i + 2, hi);
    }
    leave();
  },

  merge(a, lo = 0, hi = a.length - 1) {
    if (lo >= hi) return;
    enter(lo, hi);
    const m = (lo + hi) >> 1;
    ALG.merge(a, lo, m);
    ALG.merge(a, m + 1, hi);
    const L = a.slice(lo, m + 1), Q = a.slice(m + 1, hi + 1);
    let i = 0, j = 0, k = lo;
    const wr = v => {
      a[k] = v; W++;
      R(a, { rng: [lo, hi], swp: [k], l: 5, m: `Write ${v} to a[${k}] while merging [${lo}..${m}] and [${m+1}..${hi}].` });
      k++;
    };
    while (i < L.length && j < Q.length) {
      C++; wr(L[i] <= Q[j] ? L[i++] : Q[j++]);
    }
    while (i < L.length) wr(L[i++]);
    while (j < Q.length) wr(Q[j++]);
    leave();
  },

  heap(a) {
    const n = a.length;
    const sift = (i, e) => {
      for (;;) {
        let l = 2 * i + 1, r = l + 1, m = i;
        if (l < e) { C++; if (a[l] > a[m]) m = l; }
        if (r < e) { C++; if (a[r] > a[m]) m = r; }
        R(a, { cmp: [i, l, r].filter(x => x < e), l: 5, m: `Sift-down node ${i}: compare with children.` });
        if (m == i) return;
        sw(a, i, m);
        R(a, { swp: [i, m], l: 6, m: `Swap parent ${i} with larger child ${m}.` });
        i = m;
      }
    };
    for (let i = (n >> 1) - 1; i >= 0; i--) sift(i, n);
    for (let e = n - 1; e > 0; e--) {
      sw(a, 0, e);
      R(a, { swp: [0, e], l: 3, m: `Move max root ${a[e]} to sorted position ${e}.` });
      sift(0, e);
    }
  },

  bubble(a) {
    for (let i = 0; i < a.length - 1; i++) {
      for (let j = 0; j < a.length - 1 - i; j++) {
        C++;
        R(a, { cmp: [j, j + 1], l: 3, m: `Compare adjacent a[${j}]=${a[j]} and a[${j+1}]=${a[j+1]}.` });
        if (a[j] > a[j + 1]) {
          sw(a, j, j + 1);
          R(a, { swp: [j, j + 1], l: 4, m: `Inversion found: swap a[${j}] and a[${j+1}].` });
        }
      }
    }
  },

  insertion(a) {
    for (let i = 1; i < a.length; i++) {
      for (let j = i - 1; j >= 0; j--) {
        C++;
        R(a, { cmp: [j, j + 1], l: 3, m: `Compare key a[${j+1}]=${a[j+1]} with sorted prefix a[${j}]=${a[j]}.` });
        if (a[j] > a[j + 1]) {
          sw(a, j, j + 1);
          R(a, { swp: [j, j + 1], l: 4, m: `Shift larger element right into index ${j+1}.` });
        } else break;
      }
    }
  },

  selection(a) {
    for (let i = 0; i < a.length - 1; i++) {
      let m = i;
      for (let j = i + 1; j < a.length; j++) {
        C++;
        R(a, { cmp: [j, m], piv: m, l: 2, m: `Scan minimum: a[${j}]=${a[j]} vs current min a[${m}]=${a[m]}.` });
        if (a[j] < a[m]) m = j;
      }
      if (m != i) {
        sw(a, i, m);
        R(a, { swp: [i, m], l: 3, m: `Swap selected minimum ${a[i]} into sorted position ${i}.` });
      }
    }
  },

  binary(a) {
    a.sort((x, y) => x - y);
    const t = V.tg;
    let lo = 0, hi = a.length - 1, f = -1;
    const sn = o => R(a, { rng: [lo, hi], h: `Binary Search target = ${t}`, vars: [['target', t, 'text-ter'], ['lo', lo, 'text-pri'], ['hi', hi, 'text-pri'], ['mid', o.mid ?? '—', 'text-err'], ['Comparisons', C, 'text-fg'], ['Status', f >= 0 ? 'FOUND' : 'SEARCHING', f >= 0 ? 'text-ok' : 'text-pri']], ...o });
    sn({ l: 1, m: `Sorted array loaded. Binary searching for target ${t}.` });
    while (lo <= hi) {
      const m = (lo + hi) >> 1;
      C++;
      const tg = { [lo]: 'lo', [hi]: 'hi', [m]: ((lo == m ? 'lo ' : '') + 'mid') };
      sn({ l: 3, cmp: [m], tg, mid: m, m: `mid=${m}: a[mid]=${a[m]} ${a[m] == t ? '==' : a[m] < t ? '<' : '>'} target ${t}.` });
      if (a[m] == t) { f = m; break; }
      a[m] < t ? (lo = m + 1) : (hi = m - 1);
    }
    R(a, { rng: f < 0 ? [0, -1] : [f, f], piv: f < 0 ? null : f, h: `Target ${t}`, vars: [['target', t, 'text-ter'], ['result', f < 0 ? 'NOT FOUND' : 'INDEX ' + f, f < 0 ? 'text-err' : 'text-ok'], ['Comparisons', C, 'text-fg'], ['N', a.length, 'text-pri'], ['lo', lo, 'text-ol'], ['hi', hi, 'text-ol']], l: f < 0 ? 7 : 4, m: f < 0 ? `Target ${t} does not exist in array.` : `Target ${t} located at index ${f}!` });
  },

  linear(a) {
    const t = V.tg;
    let f = -1;
    for (let i = 0; i < a.length; i++) {
      C++;
      R(a, { cmp: [i], pi: i, l: 2, m: `Check a[${i}]=${a[i]} == target ${t}?` });
      if (a[i] == t) { f = i; break; }
    }
    R(a, { piv: f < 0 ? null : f, l: f < 0 ? 4 : 3, vars: [['target', t, 'text-ter'], ['result', f < 0 ? 'NOT FOUND' : 'INDEX ' + f, f < 0 ? 'text-err' : 'text-ok'], ['Comparisons', C, 'text-fg'], ['N', a.length, 'text-pri'], ['last_idx', f >= 0 ? f : a.length - 1, 'text-ol'], ['status', f >= 0 ? 'FOUND' : 'EXHAUSTED', f >= 0 ? 'text-ok' : 'text-err']], m: f < 0 ? `Target ${t} not found in linear scan.` : `Target ${t} found at index ${f}!` });
  },

  dijkstra() {
    const n = 7, d = Array(n).fill(1/0), vis = Array(n).fill(0), pr = Array(n).fill(-1);
    d[0] = 0;
    const adj = u => GE.map((e, k) => e[0] == u ? [e[1], V.gw[k], k] : e[1] == u ? [e[0], V.gw[k], k] : 0).filter(Boolean);
    const sn = o => R([], { ty: 'g', d: d.slice(), vis: vis.slice(), h: 'Dijkstra Shortest Path: S → T', vars: [['visited', vis.filter(x => x).length + '/' + n, 'text-ok'], ['dist[T]', d[6] == 1/0 ? '∞' : d[6], 'text-ter'], ['current', o.u == null ? '—' : GN[o.u][0], 'text-pri'], ['relaxations', W, 'text-err'], ['Comparisons', C, 'text-fg'], ['Nodes', n, 'text-mut']], ...o });
    sn({ l: 1, m: 'Initialize all vertex distances to ∞; source vertex S distance = 0.' });
    for (let r = 0; r < n; r++) {
      let u = -1;
      for (let i = 0; i < n; i++) if (!vis[i] && d[i] < 1/0 && (u < 0 || d[i] < d[u])) u = i;
      if (u < 0) break;
      vis[u] = 1;
      sn({ u, l: 3, m: `Extract-Min: select unvisited vertex ${GN[u][0]} with tentative distance ${d[u]}.` });
      for (const [v, w, k] of adj(u)) {
        if (vis[v]) continue;
        C++;
        const nd = d[u] + w, ok = nd < d[v];
        if (ok) { d[v] = nd; pr[v] = u; W++; }
        sn({ u, k, rel: ok, l: 6, m: `Edge ${GN[u][0]}→${GN[v][0]} (w=${w}): ${d[u]}+${w}=${nd} ${ok ? 'improves shortest distance — relaxed!' : 'does not improve (' + d[v] + ') — skipped.'}` });
      }
    }
    const p = [];
    for (let x = 6; x >= 0 && d[6] < 1/0; x = pr[x]) p.push(x);
    sn({ path: p, l: 0, m: d[6] < 1/0 ? `Shortest path S → T finalized! Total distance = ${d[6]}.` : 'Target vertex T is unreachable.' });
  },

  astar() {
    const n = GW * GH, wl = V.walls, g = Array(n).fill(1/0), pr = Array(n).fill(-1), op = [0], cl = [], G = n - 1;
    const h = i => Math.abs(i % GW - G % GW) + Math.abs((i / GW | 0) - (G / GW | 0));
    g[0] = 0;
    const sn = o => R([], { ty: 'm', op: op.slice(), cl: cl.slice(), h: 'A* Heuristic Pathfinding (14×8 Grid)', vars: [['open set', op.length, 'text-pri'], ['closed set', cl.length, 'text-sec'], ['g(cur)', o.u == null ? '—' : g[o.u], 'text-ter'], ['h(cur)', o.u == null ? '—' : h(o.u), 'text-err'], ['Evaluations', C, 'text-fg'], ['Goal', `(${GW-1},${GH-1})`, 'text-ok']], ...o });
    sn({ l: 1, m: 'Start cell S(0,0) initialized with g=0 and added to open set.' });
    while (op.length) {
      let b = 0;
      op.forEach((x, i) => { if (g[x] + h(x) < g[op[b]] + h(op[b])) b = i; });
      const u = op.splice(b, 1)[0];
      cl.push(u); C++;
      sn({ u, l: 3, m: `Expand cell (${u % GW}, ${u / GW | 0}) with lowest f(n) = g+h = ${g[u]}+${h(u)} = ${g[u] + h(u)}.` });
      if (u == G) {
        const p = [];
        for (let x = G; x >= 0; x = pr[x]) p.push(x);
        sn({ u, path: p, l: 4, m: `Goal cell T reached! Optimal path constructed with length ${p.length - 1}.` });
        return;
      }
      for (const [dx, dy] of [[1,0], [-1,0], [0,1], [0,-1]]) {
        const x = u % GW + dx, y = (u / GW | 0) + dy, v = y * GW + x;
        if (x < 0 || y < 0 || x >= GW || y >= GH || wl[v] || cl.includes(v)) continue;
        if (g[u] + 1 < g[v]) {
          g[v] = g[u] + 1; pr[v] = u; W++;
          if (!op.includes(v)) op.push(v);
        }
      }
      sn({ u, l: 7, m: `Neighbors evaluated. Open set size: ${op.length}.` });
    }
    sn({ l: 0, m: 'Open set exhausted: no valid unobstructed path exists to Goal.' });
  },

  knap() {
    const it = V.items, n = it.length, cp = V.cap;
    const T = Array.from({ length: n + 1 }, () => Array(cp + 1).fill(0));
    const sn = o => R([], { ty: 'd', T: T.map(r => r.slice()), h: `0/1 Knapsack (Capacity W=${cp}, ${n} Items)`, vars: [['item i', o.i ?? '—', 'text-ter'], ['capacity w', o.w ?? '—', 'text-pri'], ['dp[i][w]', o.i ? T[o.i][o.w] : '—', 'text-ok'], ['cells tabulated', C, 'text-err'], ['Items Total', n, 'text-mut'], ['Max Cap', cp, 'text-fg']], ...o });
    sn({ l: 1, m: 'Base cases: 2D DP matrix initialized to 0 for 0 items and 0 capacity.' });
    for (let i = 1; i <= n; i++) {
      for (let w = 0; w <= cp; w++) {
        C++;
        const [wt, v] = it[i - 1], tk = wt <= w, dep = [[i - 1, w]];
        T[i][w] = T[i - 1][w];
        if (tk) {
          dep.push([i - 1, w - wt]);
          T[i][w] = Math.max(T[i][w], T[i - 1][w - wt] + v);
        }
        sn({ i, w, dep, l: tk ? 6 : 4, m: tk ? `Item ${i} (weight=${wt}, val=${v}) fits! max(skip=${T[i-1][w]}, take=${T[i-1][w-wt]}+${v}) = ${T[i][w]}.` : `Item ${i} (weight=${wt}) exceeds capacity w=${w}; inherit dp[${i-1}][${w}] = ${T[i][w]}.` });
      }
    }
    let w = cp;
    const ch = [], cells = [];
    for (let i = n; i > 0; i--) {
      cells.push([i, w]);
      if (T[i][w] != T[i - 1][w]) {
        ch.unshift(i);
        w -= it[i - 1][0];
      }
    }
    cells.push([0, w]);
    sn({ cells, l: 7, m: `Backtracking complete: include items {${ch.join(', ') || 'none'}} for optimal maximum value = ${T[n][cp]}.` });
  },

  minmax_lin(a) {
    let mn = a[0], mx = a[0];
    R(a, { piv: 0, l: 2, m: `Initialize min=${mn}, max=${mx} with a[0].` });
    for (let i = 1; i < a.length; i++) {
      C++;
      const is_mn = a[i] < mn;
      R(a, { cmp: [i], piv: i, l: 4, m: `Compare a[${i}]=${a[i]} with min ${mn}: ${is_mn ? 'New Min!' : 'Not smaller.'}` });
      if (is_mn) { mn = a[i]; R(a, { piv: i, l: 5, m: `Updated min = ${mn}.` }); }
      else {
        C++;
        const is_mx = a[i] > mx;
        R(a, { cmp: [i], piv: i, l: 6, m: `Compare a[${i}]=${a[i]} with max ${mx}: ${is_mx ? 'New Max!' : 'Not larger.'}` });
        if (is_mx) { mx = a[i]; R(a, { piv: i, l: 7, m: `Updated max = ${mx}.` }); }
      }
    }
    R(a, { l: 8, m: `Linear Min-Max search complete: Minimum = ${mn}, Maximum = ${mx}.` });
  },

  minmax_dc(a, lo = 0, hi = a.length - 1) {
    if (lo >= hi) return [a[lo], a[lo]];
    enter(lo, hi);
    if (hi == lo + 1) {
      C++;
      const mn = Math.min(a[lo], a[hi]), mx = Math.max(a[lo], a[hi]);
      R(a, { rng: [lo, hi], cmp: [lo, hi], l: 3, m: `Base pair [${lo}..${hi}]: arr[${lo}]=${a[lo]}, arr[${hi}]=${a[hi]} -> min=${mn}, max=${mx}.` });
      leave();
      return [mn, mx];
    }
    const m = (lo + hi) >> 1;
    R(a, { rng: [lo, hi], l: 4, m: `Divide range [${lo}..${hi}] at mid=${m}.` });
    const [mn1, mx1] = ALG.minmax_dc(a, lo, m);
    const [mn2, mx2] = ALG.minmax_dc(a, m + 1, hi);
    C += 2;
    const mn = Math.min(mn1, mn2), mx = Math.max(mx1, mx2);
    R(a, { rng: [lo, hi], l: 5, m: `Combine range [${lo}..${hi}]: min(${mn1}, ${mn2})=${mn}, max(${mx1}, ${mx2})=${mx}.` });
    leave();
    return [mn, mx];
  },

  dyn_insert(a) {
    const idx = a.length >> 1, val = 99, n = a.length;
    R(a, { l: 1, m: `Starting dynamic insertion of value ${val} at index ${idx}.` });
    a.push(0);
    R(a, { swp: [a.length - 1], l: 2, m: `Expanded array capacity to ${a.length}.` });
    for (let j = n - 1; j >= idx; j--) {
      a[j + 1] = a[j]; W++;
      R(a, { swp: [j, j + 1], l: 4, m: `Shift element ${a[j]} right from index ${j} to ${j+1}.` });
    }
    a[idx] = val;
    R(a, { piv: idx, l: 5, m: `Inserted new value ${val} at index ${idx}!` });
  },

  kbit_cnt(a) {
    const k = 4, bits = Array(k).fill(0);
    R(bits, { l: 1, m: `Initialized ${k}-bit binary counter to 0.` });
    for (let step = 1; step <= 8; step++) {
      let i = 0;
      while (i < k && bits[i] == 1) {
        bits[i] = 0; W++;
        R(bits, { cmp: [i], l: 5, m: `Step ${step}: Bit ${i} is 1 -> flip to 0 (carry).` });
        i++;
      }
      if (i < k) {
        bits[i] = 1; W++;
        R(bits, { swp: [i], l: 6, m: `Step ${step}: Bit ${i} flipped to 1. Counter = [${bits.slice().reverse().join('')}].` });
      }
    }
  },

  closest_pair(a) {
    const pts = a.map((v, i) => [((i * 37 + 15) % 90) + 5, (v % 90) + 5]);
    let minD = 1/0, best = null;
    R(a, { l: 1, m: `Starting Closest Pair algorithm on ${pts.length} 2D points.` });
    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        C++;
        const d = Math.hypot(pts[i][0] - pts[j][0], pts[i][1] - pts[j][1]);
        if (d < minD) { minD = d; best = [i, j]; }
        R(a, { cmp: [i, j], l: 3, m: `Compare P${i}(${pts[i]}) and P${j}(${pts[j]}): dist = ${d.toFixed(1)}. Min = ${minD.toFixed(1)}.` });
      }
    }
    R(a, { swp: best, l: 4, m: `Closest pair found: P${best[0]} and P${best[1]} with distance ${minD.toFixed(1)}!` });
  },

  mat_mult(a) {
    const n = 2, A = [[a[0]||1, a[1]||2], [a[2]||3, a[3]||4]], B = [[5, 6], [7, 8]], C_mat = [[0, 0], [0, 0]];
    const flat = () => C_mat.flat();
    R(flat(), { ty: 'd', T: C_mat, l: 1, m: 'Matrix multiplication: C = A × B initialized to 0.' });
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < n; j++) {
        for (let k = 0; k < n; k++) {
          C++;
          C_mat[i][j] += A[i][k] * B[k][j];
          R(flat(), { ty: 'd', T: C_mat.map(r => r.slice()), i, w: j, l: 4, m: `C[${i}][${j}] += A[${i}][${k}] * B[${k}][${j}] (${A[i][k]}×${B[k][j]}) => C[${i}][${j}] = ${C_mat[i][j]}.` });
        }
      }
    }
  },

  fibonacci(a) {
    const n = Math.min(Math.max(a[0] || 7, 3), 10), fibs = [0, 1];
    R(fibs, { l: 1, m: `Computing Fibonacci for n=${n}. Base cases F(0)=0, F(1)=1.` });
    for (let i = 2; i <= n; i++) {
      C++;
      fibs.push(fibs[i-1] + fibs[i-2]);
      R(fibs, { cmp: [i-2, i-1], piv: i, l: 3, m: `F(${i}) = F(${i-1}) + F(${i-2}) = ${fibs[i-1]} + ${fibs[i-2]} = ${fibs[i]}.` });
    }
    R(fibs, { l: 4, m: `Fibonacci(${n}) complete. Result = ${fibs[n]}.` });
  },

  sum_digits(a) {
    let num = Math.abs(a[0] || 572), digits = String(num).split('').map(Number), sum = 0, orig = num;
    R(digits, { l: 1, m: `Starting Sum of Digits for number ${num}.` });
    for (let i = digits.length - 1; i >= 0; i--) {
      C++;
      const d = digits[i];
      sum += d;
      R(digits, { cmp: [i], l: 4, m: `Extracted digit ${d}. Total sum = ${sum}.` });
    }
    R(digits, { l: 5, m: `Sum of digits for ${orig} complete. Total sum = ${sum}.` });
  },

  dfs() {
    const n = GW * GH, wl = V.walls, stack = [0], vis = Array(n).fill(0), pr = Array(n).fill(-1), G = n - 1;
    const sn = o => R([], { ty: 'm', op: stack.slice(), cl: vis.map((v, i) => v ? i : -1).filter(x => x >= 0), h: 'Depth-First Search (DFS with Stack)', vars: [['stack size', stack.length, 'text-pri'], ['visited nodes', vis.filter(x => x).length, 'text-sec'], ['current', o.u == null ? '—' : `(${o.u % GW}, ${o.u / GW | 0})`, 'text-ter'], ['Evaluations', C, 'text-fg'], ['Goal', `(${GW-1},${GH-1})`, 'text-ok']], ...o });
    sn({ l: 1, m: 'DFS initialized with Start node (0,0) on top of Stack.' });
    while (stack.length) {
      const u = stack.pop();
      if (vis[u]) continue;
      vis[u] = 1; C++;
      sn({ u, l: 4, m: `Popped cell (${u % GW}, ${u / GW | 0}) from Stack.` });
      if (u == G) {
        const p = [];
        for (let x = G; x >= 0; x = pr[x]) p.push(x);
        sn({ u, path: p, l: 5, m: `Goal cell reached via DFS! Path constructed with length ${p.length - 1}.` });
        return;
      }
      for (const [dx, dy] of [[1,0], [0,1], [-1,0], [0,-1]]) {
        const x = u % GW + dx, y = (u / GW | 0) + dy, v = y * GW + x;
        if (x >= 0 && y >= 0 && x < GW && y < GH && !wl[v] && !vis[v]) {
          pr[v] = u; stack.push(v);
        }
      }
      sn({ u, l: 8, m: `Pushed unvisited neighbors onto Stack. Stack size: ${stack.length}.` });
    }
    sn({ l: 0, m: 'Stack empty: no path found.' });
  },

  bfs() {
    const n = GW * GH, wl = V.walls, queue = [0], vis = Array(n).fill(0), pr = Array(n).fill(-1), G = n - 1;
    vis[0] = 1;
    const sn = o => R([], { ty: 'm', op: queue.slice(), cl: vis.map((v, i) => v ? i : -1).filter(x => x >= 0), h: 'Breadth-First Search (BFS with Queue)', vars: [['queue size', queue.length, 'text-pri'], ['visited nodes', vis.filter(x => x).length, 'text-sec'], ['current', o.u == null ? '—' : `(${o.u % GW}, ${o.u / GW | 0})`, 'text-ter'], ['Evaluations', C, 'text-fg'], ['Goal', `(${GW-1},${GH-1})`, 'text-ok']], ...o });
    sn({ l: 1, m: 'BFS initialized with Start node (0,0) in Queue.' });
    while (queue.length) {
      const u = queue.shift(); C++;
      sn({ u, l: 5, m: `Dequeued cell (${u % GW}, ${u / GW | 0}) from Queue.` });
      if (u == G) {
        const p = [];
        for (let x = G; x >= 0; x = pr[x]) p.push(x);
        sn({ u, path: p, l: 6, m: `Goal cell reached via BFS! Guaranteed shortest path length = ${p.length - 1}.` });
        return;
      }
      for (const [dx, dy] of [[1,0], [0,1], [-1,0], [0,-1]]) {
        const x = u % GW + dx, y = (u / GW | 0) + dy, v = y * GW + x;
        if (x >= 0 && y >= 0 && x < GW && y < GH && !wl[v] && !vis[v]) {
          vis[v] = 1; pr[v] = u; queue.push(v);
        }
      }
      sn({ u, l: 9, m: `Enqueued unvisited level neighbors. Queue size: ${queue.length}.` });
    }
    sn({ l: 0, m: 'Queue empty: no path found.' });
  },

  greedy() {
    const n = GW * GH, wl = V.walls, op = [0], cl = [], pr = Array(n).fill(-1), G = n - 1;
    const h = i => Math.abs(i % GW - G % GW) + Math.abs((i / GW | 0) - (G / GW | 0));
    const sn = o => R([], { ty: 'm', op: op.slice(), cl: cl.slice(), h: 'Greedy Best-First Search (h(n) Only)', vars: [['open set', op.length, 'text-pri'], ['closed set', cl.length, 'text-sec'], ['h(cur)', o.u == null ? '—' : h(o.u), 'text-err'], ['Evaluations', C, 'text-fg'], ['Goal', `(${GW-1},${GH-1})`, 'text-ok']], ...o });
    sn({ l: 1, m: 'Greedy Best-First Search initialized. Note: Greedy Best-First Search chooses the node that appears closest to the goal. It does not consider the cost already spent.' });
    while (op.length) {
      let b = 0;
      op.forEach((x, i) => { if (h(x) < h(op[b])) b = i; });
      const u = op.splice(b, 1)[0];
      cl.push(u); C++;
      sn({ u, l: 4, m: `Expanded cell (${u % GW}, ${u / GW | 0}) with lowest estimated heuristic h(n) = ${h(u)}.` });
      if (u == G) {
        const p = [];
        for (let x = G; x >= 0; x = pr[x]) p.push(x);
        sn({ u, path: p, l: 5, m: `Goal cell reached via Greedy Search! Path length = ${p.length - 1}.` });
        return;
      }
      for (const [dx, dy] of [[1,0], [0,1], [-1,0], [0,-1]]) {
        const x = u % GW + dx, y = (u / GW | 0) + dy, v = y * GW + x;
        if (x >= 0 && y >= 0 && x < GW && y < GH && !wl[v] && !cl.includes(v) && !op.includes(v)) {
          pr[v] = u; op.push(v);
        }
      }
      sn({ u, l: 7, m: `Enqueued neighbors prioritized strictly by h(n). Open set size: ${op.length}.` });
    }
    sn({ l: 0, m: 'Open set empty: no path found.' });
  },

  w_astar() {
    const n = GW * GH, wl = V.walls, g = Array(n).fill(1/0), pr = Array(n).fill(-1), op = [0], cl = [], G = n - 1, w = 1.5;
    const h = i => Math.abs(i % GW - G % GW) + Math.abs((i / GW | 0) - (G / GW | 0));
    g[0] = 0;
    const sn = o => R([], { ty: 'm', op: op.slice(), cl: cl.slice(), h: `Weighted A* Search (w=${w})`, vars: [['weight w', w, 'text-ter'], ['open set', op.length, 'text-pri'], ['closed set', cl.length, 'text-sec'], ['g(cur)', o.u == null ? '—' : g[o.u], 'text-pri'], ['w*h(cur)', o.u == null ? '—' : (w * h(o.u)).toFixed(1), 'text-err'], ['Evaluations', C, 'text-fg']], ...o });
    sn({ l: 1, m: `Weighted A* initialized with weight w = ${w}. f(n) = g(n) + ${w} * h(n).` });
    while (op.length) {
      let b = 0;
      op.forEach((x, i) => { if (g[x] + w * h(x) < g[op[b]] + w * h(op[b])) b = i; });
      const u = op.splice(b, 1)[0];
      cl.push(u); C++;
      sn({ u, l: 4, m: `Expanded cell (${u % GW}, ${u / GW | 0}) with lowest f(n) = g+w*h = ${g[u]}+${(w*h(u)).toFixed(1)} = ${(g[u]+w*h(u)).toFixed(1)}.` });
      if (u == G) {
        const p = [];
        for (let x = G; x >= 0; x = pr[x]) p.push(x);
        sn({ u, path: p, l: 5, m: `Weighted A* (w=${w}) reached Goal! Path length = ${p.length - 1}, Nodes explored = ${cl.length}.` });
        return;
      }
      for (const [dx, dy] of [[1,0], [0,1], [-1,0], [0,-1]]) {
        const x = u % GW + dx, y = (u / GW | 0) + dy, v = y * GW + x;
        if (x < 0 || y < 0 || x >= GW || y >= GH || wl[v] || cl.includes(v)) continue;
        if (g[u] + 1 < g[v]) {
          g[v] = g[u] + 1; pr[v] = u; W++;
          if (!op.includes(v)) op.push(v);
        }
      }
      sn({ u, l: 8, m: `Neighbors updated with weighted heuristic w=${w}. Open set size: ${op.length}.` });
    }
  },

  ai_compare() {
    ALG.astar();
  }
};

function gen(al, arr) {
  S = []; TR = []; STK = []; C = W = 0;
  const a = (arr || []).slice(), t = META[al].t;
  if (!t) R(a, { l: 0, m: 'Initial array buffer loaded into execution registers.' });
  ALG[al](a);
  if (!t) R(a, { sd: 1, l: 0, m: 'Array fully sorted ✔ Invariant successfully verified.' });
  S.T = TR;
  return S;
}

const mkG = () => GE.map(() => 1 + rnd(9));
const mkI = () => Array.from({ length: 5 }, () => [1 + rnd(6), 1 + rnd(9)]);
const mkW = () => {
  for (let t = 0; t < 40; t++) {
    V.walls = Array.from({ length: GW * GH }, (_, i) => i && i < GW * GH - 1 && Math.random() < 0.28);
    if (gen('astar').at(-1).path) return;
  }
  V.walls = Array(GW * GH).fill(false);
};

// ---- Audio cues (Web Audio API) ----
const AU = { on: false, ctx: null };
const pitch = s => {
  const i = (s.swp || s.cmp || [0])[0];
  const v = s.a && s.a[i];
  return v != null ? 200 + v * 8 : 320 + (V.i * 37) % 500;
};
function beep(f) {
  if (!AU.on) return;
  try {
    AU.ctx = AU.ctx || new (window.AudioContext || window.webkitAudioContext)();
    const o = AU.ctx.createOscillator(), g = AU.ctx.createGain();
    o.type = 'triangle';
    o.frequency.value = f;
    g.gain.value = 0.05;
    o.connect(g);
    g.connect(AU.ctx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, AU.ctx.currentTime + 0.12);
    o.stop(AU.ctx.currentTime + 0.13);
  } catch (e) {}
}

const q = t => '"' + String(t).replace(/"/g, '""') + '"';
const dl = (n, t, m) => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([t], { type: m }));
  a.download = n;
  a.click();
};

const mk = (k, n) => {
  let a = Array.from({ length: n }, () => 1 + rnd(99));
  if (k == 'nearly') {
    a.sort((x, y) => x - y);
    for (let t = 0; t < Math.max(1, n / 10 | 0); t++) sw(a, rnd(n), rnd(n));
  }
  if (k == 'rev') a.sort((x, y) => y - x);
  if (k == 'few') a = a.map(() => [10, 30, 50, 70][rnd(4)]);
  return a;
};
const parse = t => (t.match(/\d+/g) || []).map(Number).slice(0, 60);

function tick() {
  if (RT == 'visualize') {
    if (V.i < V.S.length - 1) {
      V.i++;
      beep(pitch(V.S[V.i]));
    } else {
      stop();
      logRun();
    }
    paintV();
  } else if (RT == 'compare') {
    const mx = Math.max(CP.SA.length, CP.SB.length) - 1;
    if (CP.i < mx) CP.i++;

    paintC();

function logRun() {
  if (V.lg) return;

  const s = V.S.at(-1);

  HIST = HIST.slice(0, 50);
  try { localStorage.av = JSON.stringify(HIST); } catch (e) {}
}

function navTo(tab, e) {
  if (e) {
    if (typeof e.preventDefault === 'function') e.preventDefault();
    if (typeof e.stopPropagation === 'function') e.stopPropagation();

  if (tab && views[tab]) RT = tab;
  try {
    if (window.location && window.location.hash !== undefined) {

  route(tab);

// ---- visualizers & renderers ----
const cc = (s, i) => s.sd ? 'bg-ok text-s0' : s.swp && s.swp.includes(i) ? 'bg-err text-s0' : s.piv === i ? 'bg-ter text-s0' : s.cmp && s.cmp.includes(i) ? 'bg-pri text-s0' : s.rng && (i < s.rng[0] || i > s.rng[1]) ? 'bg-s3 text-ol opacity-50' : 'bg-s4 text-mut';

function bars(s, h = 'h-64') {
  const a = s.a, mx = Math.max(...a, 1), n = a.length;
  return `<div class="flex items-end gap-1 ${h} px-1">${a.map((v, i) => {
    let c = 'bg-s4 text-mut', tag = '';

    if (s.sd) c = 'bg-ok text-s0 font-bold';
    if (s.piv === i) { c = 'bg-ter text-s0 font-bold'; tag = 'P'; }
    if (s.cmp && s.cmp.includes(i)) { c = 'bg-pri text-s0 font-bold'; tag = '■'; }
    if (s.swp && s.swp.includes(i)) { c = 'bg-err text-s0 font-bold'; tag = '⇄'; }

      <span class="text-[10px] font-mono text-ter h-4 whitespace-nowrap">${tag}</span>
      <div class="b w-full rounded-t ${c} flex justify-center pt-1 text-[11px] font-mono font-semibold overflow-hidden shadow-sm" style="height:${(v / mx) * 82}%">${n <= 26 ? v : ''}</div>
      <span class="text-[9px] font-mono text-ol">[${n <= 30 ? i : ''}]</span>
    </div>`;
  }).join('')}</div>`;
}

const matrix = s => {
  const c = Math.ceil(Math.sqrt(s.a.length));
  return `<div class="grid gap-1.5 p-2 bg-s1 rounded-xl h-64 overflow-y-auto" style="grid-template-columns:repeat(${c},1fr)">

      <div class="${cc(s, i)} rounded p-2 text-center font-mono flex flex-col justify-between">
        <div class="text-[9px] opacity-70">[${i / c | 0},${i % c}]</div>
        <div class="text-base font-bold">${v}</div>
      </div>`).join('')}

const mem = s => `
  <div class="h-64 overflow-y-auto font-mono text-xs p-2 bg-s1 rounded-xl flex flex-col gap-1">
    ${s.a.map((v, i) => `
      <div class="flex items-center gap-3 px-3 py-1 rounded ${cc(s, i)}">
        <span class="w-28 opacity-75 font-mono">0x${(0x7ffe0000 + i * 4).toString(16)}</span>
        <span class="w-12 font-mono text-mut">[${i}]</span>

        <span class="opacity-75 font-mono text-[11px]">${v.toString(2).padStart(8, '0')}</span>
      </div>`).join('')}
  </div>`;

const graphSvg = s => {
  const P = s.path || [], pe = new Set(P.slice(1).map((v, i) => [P[i], v].sort().join()));
  return `<svg viewBox="0 0 560 300" class="w-full h-64 bg-s1 rounded-xl p-2">
    ${GE.map(([a, b], k) => {
      const A = GN[a], B = GN[b];
      const c = pe.has([a, b].sort().join()) ? '#10B981' : s.k === k ? (s.rel ? '#fb7185' : '#6ea0ff') : '#3a4070';
      return `<line x1="${A[1]}" y1="${A[2]}" x2="${B[1]}" y2="${B[2]}" stroke="${c}" stroke-width="${pe.has([a, b].sort().join()) ? 4 : 2.5}"/>
      <text x="${(A[1] + B[1]) / 2}" y="${(A[2] + B[2]) / 2 - 6}" fill="#a9afd0" font-size="11" text-anchor="middle" font-family="JetBrains Mono">${V.gw[k]}</text>`;
    }).join('')}
    ${GN.map((n, i) => {
      const c = P.includes(i) ? '#10B981' : s.u === i ? '#fbbf24' : s.vis && s.vis[i] ? '#7c6cff' : '#7a82ad';
      return `<circle cx="${n[1]}" cy="${n[2]}" r="18" fill="#10132a" stroke="${c}" stroke-width="3"/>
      <text x="${n[1]}" y="${n[2] + 4}" fill="#e8ebff" font-size="13" font-weight="bold" text-anchor="middle" font-family="JetBrains Mono">${n[0]}</text>
      <text x="${n[1]}" y="${n[2] + 34}" fill="#6ea0ff" font-size="10" text-anchor="middle" font-family="JetBrains Mono">${s.d && s.d[i] < 1/0 ? s.d[i] : '∞'}</text>`;
    }).join('')}
  </svg>`;
};

const gridV = s => `
  <div class="grid gap-1 p-2 bg-s1 rounded-xl h-64 overflow-y-auto" style="grid-template-columns:repeat(${GW},1fr)">
    ${V.walls.map((w, i) => {
      const c = w ? 'bg-olv' : (s.path || []).includes(i) ? 'bg-ok text-s0 font-bold' : s.u === i ? 'bg-ter text-s0 font-bold' : (s.cl || []).includes(i) ? 'bg-sec/40 text-fg' : (s.op || []).includes(i) ? 'bg-pc/60 text-s0 font-bold' : 'bg-s2 text-ol';
      return `<div class="${c} aspect-square rounded flex items-center justify-center text-[10px] font-mono">${i == 0 ? 'S' : i == GW * GH - 1 ? 'T' : ''}</div>`;
    }).join('')}
  </div>`;

const dpV = s => {
  const it = V.items, cp = V.cap;
  const fd = (i, w) => i == 0 || s.i == null || i < s.i || (i == s.i && w <= s.w);
  const is = (a, i, w) => (a || []).some(x => x[0] == i && x[1] == w);
  return `<div class="h-64 overflow-auto bg-s1 rounded-xl p-2 border border-s3/40">
    <table class="font-mono text-xs w-full text-center">
      <thead>
        <tr>
          <th class="p-1.5 text-ol font-medium">i \\ w</th>
          ${Array.from({ length: cp + 1 }, (_, w) => `<th class="p-1.5 text-ol">${w}</th>`).join('')}
        </tr>
      </thead>
      <tbody>
        ${s.T.map((r, i) => `
          <tr class="border-t border-s3/30">
            <td class="p-1.5 text-left text-ol whitespace-nowrap font-medium">${i ? `Item ${i} (${it[i-1][0]}:${it[i-1][1]})` : '—'}</td>
            ${r.map((v, w) => `<td class="p-1.5 ${s.i == i && s.w == w ? 'bg-ter text-s0 font-bold' : is(s.cells, i, w) ? 'bg-ok text-s0 font-bold' : is(s.dep, i, w) ? 'bg-pc/30 text-pri font-bold' : 'text-mut'}">${fd(i, w) ? v : ''}</td>`).join('')}
          </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
};

  if (s.ty == 'm') return gridV(s);
  if (s.ty == 'd') return dpV(s);

        <button type="button" onclick="navTo('visualize', event)" class="hover:text-white transition-colors">Runtime Deck</button>
        <button type="button" onclick="navTo('vision', event)" class="hover:text-white transition-colors">Tensor Lab</button>
      </div>
    </div>
  </div>
</footer>`;

let SC = null;
function scene(on) {
  const cv = $('#scene');
  cv.style.display = on ? 'block' : 'none';
  if (!on) { if (SC && SC.raf) { cancelAnimationFrame(SC.raf); SC.raf = 0; } return; }
  if (SC) { if (!SC.raf) SC.run(); return; }
  if (!window.THREE) return;
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const R = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
  R.setPixelRatio(Math.min(devicePixelRatio, 1.75));
  R.setClearColor(0x000000, 0);
  const sc = new THREE.Scene(), cam = new THREE.PerspectiveCamera(55, 1, .1, 100);
  cam.position.z = 9;
  sc.fog = new THREE.FogExp2(0x070815, .04);
  sc.add(new THREE.AmbientLight(0x8890ff, .55));
  const l1 = new THREE.PointLight(0x4f8cff, 2.4, 40); l1.position.set(-6, 4, 6); sc.add(l1);
  const l2 = new THREE.PointLight(0x9b5cff, 2.4, 40); l2.position.set(6, -3, 5); sc.add(l2);

  const geos = [new THREE.IcosahedronGeometry(1, 0), new THREE.OctahedronGeometry(1, 0), new THREE.TetrahedronGeometry(1, 0), new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.TorusGeometry(.8, .28, 12, 36)];
  const big = [[5.2, 1, -3], [-5.5, -.5, -4], [3, 2.8, -6]];
  const objs = [];
  for (let i = 0; i < 18; i++) {
    const g = geos[i % geos.length], col = i % 2 ? 0x6d8cff : 0xa07bff;
    const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: col, metalness: .6, roughness: .25, transparent: true, opacity: .34, emissive: col, emissiveIntensity: .28 }));
    m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g), new THREE.LineBasicMaterial({ color: 0xbcc8ff, transparent: true, opacity: .55 })));
    if (i < 3) { m.position.set(...big[i]); m.scale.setScalar(1.7 + i * .2); }
    else { m.position.set((Math.random() < .5 ? -1 : 1) * (2.5 + Math.random() * 7), (Math.random() - .5) * 8, -1 - Math.random() * 7); m.scale.setScalar(.35 + Math.random() * .55); }
    m.userData = { rx: .002 + Math.random() * .006, ry: .002 + Math.random() * .006, f: Math.random() * 6, a: .2 + Math.random() * .4, y: m.position.y };
    sc.add(m); objs.push(m);
  }

  const N = 1100, pos = new Float32Array(N * 3), col = new Float32Array(N * 3), cc = new THREE.Color();
  for (let i = 0; i < N; i++) {
    pos.set([(Math.random() - .5) * 30, (Math.random() - .5) * 18, 4 - Math.random() * 16], i * 3);
    cc.setHSL(.6 + Math.random() * .14, .9, .68); col.set([cc.r, cc.g, cc.b], i * 3);
  }
  const pg = new THREE.BufferGeometry();
  pg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  pg.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const tc = document.createElement('canvas'); tc.width = tc.height = 64;
  const cx = tc.getContext('2d'), gr = cx.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.3, 'rgba(255,255,255,.5)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  cx.fillStyle = gr; cx.fillRect(0, 0, 64, 64);
  const pts = new THREE.Points(pg, new THREE.PointsMaterial({ size: .17, map: new THREE.CanvasTexture(tc), vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  sc.add(pts);

  // a row of bars that keeps bubble-sorting itself
  const NB = 18, bars = [], tg = [], grp = new THREE.Group();
  grp.position.set(0, -3.7, -1); sc.add(grp);
  const shuffle = () => { for (let i = 0; i < NB; i++) tg[i] = .4 + Math.random() * 2.6; };
  shuffle();
  for (let i = 0; i < NB; i++) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(.32, 1, .32), new THREE.MeshStandardMaterial({ color: 0x6d8cff, emissive: 0x6d5efc, emissiveIntensity: .5, transparent: true, opacity: .55, metalness: .3, roughness: .4 }));
    b.position.x = (i - (NB - 1) / 2) * .55; b.scale.y = tg[i]; grp.add(b); bars.push(b);
  }
  let bi = 0, bj = 0, last = 0;
  const stepSort = () => {
    if (tg[bj] > tg[bj + 1]) { const t = tg[bj]; tg[bj] = tg[bj + 1]; tg[bj + 1] = t; }
    if (++bj >= NB - 1 - bi) { bj = 0; if (++bi >= NB - 1) { bi = 0; shuffle(); } }
  };

  const mo = { x: 0, y: 0 };
  addEventListener('pointermove', e => { mo.x = e.clientX / innerWidth - .5; mo.y = e.clientY / innerHeight - .5; });
  const rs = () => { R.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); if (RM && SC) SC.run(); };
  addEventListener('resize', rs); rs();

  const clock = new THREE.Clock();
  const loop = () => {
    if (!RM) SC.raf = requestAnimationFrame(loop);
    const t = clock.getElapsedTime(), sy = Math.min(scrollY, 900);
    cam.position.x += (mo.x * 1.6 - cam.position.x) * .04;
    cam.position.y += (-mo.y * 1.0 - sy * .004 - cam.position.y) * .04;
    cam.position.z = 9 + sy * .006;
    cam.lookAt(0, 0, 0);
    objs.forEach(o => { const d = o.userData; o.rotation.x += d.rx; o.rotation.y += d.ry; o.position.y = d.y + Math.sin(t * .6 + d.f) * d.a; });
    pts.rotation.y = t * .012;
    if (!RM && t - last > .12) { last = t; stepSort(); }
    bars.forEach((b, i) => { b.scale.y += (tg[i] - b.scale.y) * .18; b.position.y = b.scale.y / 2; b.material.emissiveIntensity = (i == bj || i == bj + 1) ? 1.4 : .5; });
    R.render(sc, cam);
  };
  SC = { raf: 0, run() { if (!this.raf) loop(); } };
  SC.run();
}

let GRIDSCAN = null;
function updateBackgrounds(r) {
  const isHome = (r === 'home');
  // 1. Landing 3D scene (Three.js with floating geometric meshes & sorting bars strictly for landing page)
  scene(isHome);

  // 2. GridScan 3D Tunnel background (STRICTLY for all non-landing pages, matching exact customization)
  const bg = $('#bg-gridscan');
  if (isHome) {
    if (GRIDSCAN) GRIDSCAN.hide();
    else if (bg) bg.style.display = 'none';
  } else {
    if (!GRIDSCAN && window.createGridScan && bg) {
      GRIDSCAN = window.createGridScan(bg, {
        linesColor: '#4d4757',
        scanColor: '#7c3aed',
        cells: 8,
        lineThickness: 1,
        lineStyle: 'solid',
        depth: 3,
        depthFade: 0.6,
        parallax: 1,
        shading: 0.7,
        reflection: 0.35,
        scanDirection: 'forward',
        scanDuration: 2.4,
        scanDelay: 1.6,
        scanWidth: 1,
        trail: 0.5,
        glow: 0.6,
        points: true,
        autoScan: true,
        interactive: true,
        clickEffect: 'ping',
        intro: true,
        lightMode: false
      });
      window.GRID_SCAN = GRIDSCAN;
    }
    if (GRIDSCAN) GRIDSCAN.show();
    else if (bg) bg.style.display = 'block';
  }
}
window.updateBackgrounds = updateBackgrounds;

// Router that works unconditionally
function route(targetRoute) {
  stop();
  if (targetRoute && views[targetRoute]) {
    RT = targetRoute;
  } else if (!RT || !views[RT]) {
    let hash = '';
    try { hash = (location.hash.slice(1) || location.pathname.replace(/^\/+|\/+$/g, '')).toLowerCase(); } catch (e) {}
    RT = views[hash] ? hash : 'home';
  }

  const chg = PRT !== RT; PRT = RT;
  document.body.dataset.r = RT;
  const gr = (RT == 'vision') ? 'vision' : (RT == 'home') ? 'home' : (RT == 'about') ? 'about' : (RT == 'compare') ? 'compare' : 'algo';
  $('#nav').innerHTML = NAV.map(([k, t, ic, g]) => `
    <button type="button" onclick="navTo('${k}', event)" class="nl ${g == gr ? 'on' : ''}" ${g == gr ? 'aria-current="page"' : ''}>
      <span class="ms" style="font-size:17px">${ic}</span>
      <span>${t}</span>
    </button>`).join('');

  if (RT == 'visualize' && !V.S.length) ldV();
  if (RT == 'compare' && !CP.SA.length) ldC();

  $('#app').classList.toggle('vin', chg);
  $('#app').innerHTML = subnav() + views[RT]() + renderFooter();
  updateBackgrounds(RT);

  if (RT == 'visualize') { stratUI(); paintV(); }
  if (RT == 'compare') paintC();
  if (RT == 'datasets') paintDS();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

const stratUI = () => {
  const st = $('#strat');
  if (!st) return;
  st.innerHTML = V.algo == 'quick' ? `
    <div class="flex items-center gap-1 p-0.5 bg-s1 rounded-lg border border-s3/40">
      <button data-a="strat" data-v="hoare" class="${seg(ST == 'hoare')} py-1 px-2.5 text-xs">Hoare</button>
      <button data-a="strat" data-v="lomuto" class="${seg(ST == 'lomuto')} py-1 px-2.5 text-xs">Lomuto</button>
    </div>` : '';
};

const setArr = a => {
  if (a.length < 2) return;
  V.arr = a;
  stop();
  ldV();
  route();
};

// ---- actions ----
const act = {
  play() {
    if (RT == 'visualize') {
      if (P) stop();
      else {
        if (V.i >= V.S.length - 1) { V.i = 0; V.lg = 0; }
        start();
      }
      paintV();
    }
  },
  reset() { stop(); V.i = 0; V.lg = 0; paintV(); },
  stp(v) {
    stop();
    const n = V.S.length - 1;
    V.i = v == 'first' ? 0 : v == 'last' ? n : Math.max(0, Math.min(n, V.i + +v));
    paintV();
  },
  strat(v) { ST = v; stop(); ldV(); stratUI(); paintV(); },
  apply() {
    const t = TY(V.algo);
    const v = ($('#vIn') || {}).value || '';
    if (t == 'dp') {
      const p = (v.match(/\d+\s*:\s*\d+/g) || []).map(x => x.split(':').map(Number)).slice(0, 8);
      if (p.length) { V.items = p; stop(); ldV(); route(); }
    } else {
      if ($('#vT')) V.tg = +$('#vT').value;
      setArr(parse(v));
    }
  },
  pre(v) {
    const t = TY(V.algo);
    if (t == 'graph') V.gw = mkG();
    else if (t == 'grid') mkW();
    else if (t == 'dp') V.items = mkI();
    else {
      V.arr = mk(v, V.arr.length);
      if (t == 'search') V.tg = V.arr[rnd(V.arr.length)];
    }
    stop(); ldV(); route();
  },
  view(v) { V.view = v; paintV(); },
  audio() {
    AU.on = !AU.on;
    beep(440);
    const au = $('#au');
    if (au) au.className = 'w-9 h-5 rounded-full p-0.5 flex cursor-pointer transition-colors ' + (AU.on ? 'bg-ter justify-end' : 'bg-s4');
    const navAu = $('#navAudio');
    if (navAu) navAu.className = 'nav-audio-btn ' + (AU.on ? 'on' : '');
  },
  exp(v) {
    const n = V.algo;
    v == 'csv'
      ? dl(n + '_trace.csv', ['step,comparisons,swaps,message,array', ...V.S.map((s, i) => [i, s.c, s.w, q(s.m), q(s.a ? s.a.join(' ') : '')].join(','))].join('\n'), 'text/csv')
      : dl(n + '_trace.json', JSON.stringify({ algorithm: n, steps: V.S }, null, 2), 'application/json');
  },
  cexp(v) {
    const A = CP.SA, B = CP.SB, n = Math.max(A.length, B.length);
    v == 'csv'
      ? dl('compare_trace.csv', [`step,${CP.a}_comparisons,${CP.a}_writes,${CP.b}_comparisons,${CP.b}_writes`, ...Array.from({ length: n }, (_, i) => {
          const a = A[Math.min(i, A.length - 1)], b = B[Math.min(i, B.length - 1)];
          return [i, a.c, a.w, b.c, b.w].join(',');
        })].join('\n'), 'text/csv')
      : dl('compare_trace.json', JSON.stringify({ input: CP.arr, [CP.a]: A, [CP.b]: B }, null, 2), 'application/json');
  },
  hexp() {
    dl('history.csv', ['time,algorithm,n,steps,comparisons,writes', ...HIST.map(h => [q(h.t), q(h.al), h.n, h.st, h.c, h.w].join(','))].join('\n'), 'text/csv');
  },
  launch(k) { V.algo = k; V.S = []; navTo('visualize'); },
  cmpAdd(k) {
    CP.b = CP.a == k ? CP.b : k;
    if (CP.a == CP.b) CP.b = Object.keys(META).find(x => x != CP.a);
    if (CP.a == k) CP.a = k;
    CP.SA = [];
    navTo('compare');
  },
  fil(v) { FIL = v; route(); },
  cpre(v) { stop(); CP.arr = mk(v, 20); ldC(); route(); },
  cplay() {
    if (P) stop();
    else {
      if (CP.i >= Math.max(CP.SA.length, CP.SB.length) - 1) CP.i = 0;
      start();
    }
    paintC();
  },
  cstep() {
    stop();
    if (CP.i < Math.max(CP.SA.length, CP.SB.length) - 1) CP.i++;
    paintC();
  },
  creset() { stop(); CP.i = 0; paintC(); },
  dsk(v) { DS.k = v; DS.arr = mk(v, DS.n); route(); },
  dsV() {
    if (!['sort', 'search'].includes(TY(V.algo))) V.algo = 'quick';
    setArr(DS.arr.slice());
    navTo('visualize');
  },
  dsC() { CP.arr = DS.arr.slice(); ldC(); navTo('compare'); },
  dlexport(fmt) {
    let content = '', mime = 'text/plain', filename = 'dataset.' + fmt;
    if (fmt == 'csv') { content = 'value\n' + DS.arr.join('\n'); mime = 'text/csv'; }
    else if (fmt == 'json') { content = JSON.stringify(DS.arr, null, 2); mime = 'application/json'; }
    dl(filename, content, mime);
  },
  clear() { HIST = []; try { localStorage.av = '[]'; } catch (e) {} route(); },
  hdel(v) { HIST.splice(+v, 1); try { localStorage.av = JSON.stringify(HIST); } catch (e) {} route(); }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (b && act[b.dataset.a]) act[b.dataset.a](b.dataset.v);
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id == 'vSp') { V.sp = +t.value; $('#sv').textContent = V.sp + 'x'; if (P) start(); }
  else if (t.id == 'cSp') { CP.sp = +t.value; if (P) start(); }
  else if (t.id == 'vScrub') { stop(); V.i = +t.value; paintV(); }
  else if (t.id == 'vN') {
    $('#nv').textContent = t.value;
    if (TY(V.algo) == 'dp') V.cap = +t.value;
    else {
      V.arr = mk('rand', +t.value);
      if ($('#vIn')) $('#vIn').value = '[' + V.arr + ']';
      if (TY(V.algo) == 'search') {
        V.tg = V.arr[rnd(V.arr.length)];
        if ($('#vT')) $('#vT').value = V.tg;
      }
    }
    stop(); ldV(); paintV();
  }
  else if (t.id == 'dN') { DS.n = +t.value; $('#dnv').textContent = DS.n; DS.arr = mk(DS.k, DS.n); paintDS(); }
  else if (t.id == 'q') {
    const p = t.selectionStart;
    route();
    const q = $('#q');
    if (q) { q.focus(); q.setSelectionRange(p, p); }
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id == 'vT') { V.tg = +t.value; stop(); ldV(); paintV(); }
  else if (t.id == 'vAlgo') { V.algo = t.value; stop(); ldV(); route(); }
  else if (t.id == 'cA' || t.id == 'cB') { CP.a = $('#cA').value; CP.b = $('#cB').value; stop(); ldC(); route(); }
});

document.addEventListener('keydown', e => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) && e.target.type != 'range') return;
  if (RT == 'visualize') {
    if (e.code == 'Space') { e.preventDefault(); act.play(); }
    else if (e.key == 'ArrowRight') act.stp('1');
    else if (e.key == 'ArrowLeft') act.stp('-1');
    else if (e.key == 'r' || e.key == 'R') act.reset();
  } else if (RT == 'compare' && e.code == 'Space') {
    e.preventDefault();
    act.cplay();
  }
});

window.addEventListener('hashchange', () => { const h = (location.hash.slice(1) || 'home').toLowerCase(); if (views[h] && h !== RT) route(h); });
route();
</script>
<script>
  if (typeof updateBackgrounds === 'function' && typeof RT !== 'undefined') {
    updateBackgrounds(RT);
  }
</script>
</body>
</html>
